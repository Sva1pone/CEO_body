name: Сообщить об ошибке
description: Воспроизводимая проблема в приложении
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение. Не прикладывайте личную БД, отчёты, фотографии, токены и другие персональные данные.
  - type: checkboxes
    id: checks
    attributes:
      label: Предварительная проверка
      options:
        - label: Я проверил существующие Issues и не нашёл дубликат.
          required: true
        - label: Пример не содержит персональных данных.
          required: true
  - type: input
    id: version
    attributes:
      label: Версия
      description: Release или короткий commit hash.
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Операционная система
      options:
        - Windows 11
        - Windows 10
        - Другая
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть...
        2. Нажать...
        3. Увидеть...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Дополнительная диагностика
      description: Обезличенные сообщения консоли, скриншоты или другая полезная информация.
      render: text
